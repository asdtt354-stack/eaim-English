<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#2563EB"/>
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="230" fill="#1D4ED8" opacity="0.5"/>
  <!-- Big E letter -->
  <text x="256" y="310" font-family="Arial Black, sans-serif" font-size="240" font-weight="900"
    fill="white" text-anchor="middle" opacity="0.15">E</text>
  <!-- EAIM text -->
  <text x="256" y="240" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="110"
    font-weight="900" fill="white" text-anchor="middle" letter-spacing="8">EAIM</text>
  <!-- 영어 text -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="60"
    font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="middle">영어플랫폼</text>
  <!-- Small emoji decoration -->
  <text x="140" y="390" font-size="52" text-anchor="middle">📚</text>
  <text x="256" y="400" font-size="52" text-anchor="middle">🎮</text>
  <text x="372" y="390" font-size="52" text-anchor="middle">⭐</text>
</svg>
